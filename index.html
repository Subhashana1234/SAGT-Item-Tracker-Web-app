    // ==========================================
    // STAGE 3: RECEIVING & INSPECTION
    // ==========================================
    function Stage3ReceivingView({ items, onSubmit, darkMode:dm }) {
      const bgCard=dm?'bg-slate-800':'bg-white'; const borderC=dm?'border-slate-700':'border-slate-200';
      const textMain=dm?'text-slate-100':'text-slate-900'; const textSub=dm?'text-slate-400':'text-slate-500';
      const bgInput=dm?'bg-slate-700 border-slate-600 text-slate-100':'bg-slate-50 border-slate-200 text-slate-900';

      const [selectedId, setSelectedId] = useState("");
      const [data, setData] = useState({
        goodsReceivedDate: new Date().toISOString().slice(0,10),
        receivedThisTime: 1,
        docRefNo: "",
        receivedBy: "",
        inspectedBy: "",
        status: "Completed & Ready"
      });
      const [guardrailMsg, setGuardrailMsg] = useState("");

      const selectedItem = items.find(i=>i.id===selectedId);
      const dispatchedQty = selectedItem?.dispatchQty || 1;
      const previouslyReceived = selectedItem?.receivedQty || 0;
      const pendingBalance = Math.max(0, dispatchedQty - previouslyReceived);
      const unit = selectedItem?.dispatchUom || "Each";

      useEffect(() => {
        if (selectedItem) {
          const prev = selectedItem.receivedQty || 0;
          const disp = selectedItem.dispatchQty || 1;
          const pend = Math.max(0, disp - prev);
          const defaultIncrement = pend > 0 ? pend : 1;
          const defaultTotal = prev + defaultIncrement;
          const autoStatus = defaultTotal < disp ? "Partially Received" : "Completed & Ready";

          setData({
            goodsReceivedDate: selectedItem.goodsReceivedDate || new Date().toISOString().slice(0,10),
            receivedThisTime: defaultIncrement,
            docRefNo: selectedItem.docRefNo || "",
            receivedBy: selectedItem.receivedBy || "",
            inspectedBy: selectedItem.inspectedBy || "",
            status: autoStatus
          });
          setGuardrailMsg("");
        } else {
          setSelectedId("");
        }
      }, [selectedId, selectedItem]);

      const thisTimeQty = typeof data.receivedThisTime === 'number' ? data.receivedThisTime : (parseInt(data.receivedThisTime, 10) || 0);
      const newTotal = Math.min(dispatchedQty, previouslyReceived + thisTimeQty);
      const remainingAfter = Math.max(0, dispatchedQty - newTotal);
      const isCompleteNow = newTotal >= dispatchedQty;
      const pct = Math.min(100, Math.round((newTotal / dispatchedQty) * 100));

      const handleIncrementChange = val => {
        if (val === '') {
          setData(prev=>({ ...prev, receivedThisTime: '' }));
          return;
        }
        let num = parseInt(val, 10);
        if (isNaN(num) || num < 1) num = 1;

        if (num > pendingBalance) {
          num = pendingBalance;
          setGuardrailMsg(`Received amount cannot exceed pending balance (${pendingBalance} ${unit}). Clamped to ${pendingBalance}.`);
        } else {
          setGuardrailMsg("");
        }

        const autoStatus = (previouslyReceived + num) < dispatchedQty ? "Partially Received" : "Completed & Ready";
        setData(prev=>({
          ...prev,
          receivedThisTime: num,
          status: autoStatus
        }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        if(!selectedId || !selectedItem) return;

        const inc = typeof data.receivedThisTime === 'number' ? data.receivedThisTime : (parseInt(data.receivedThisTime, 10) || 0);
        if (inc < 1) {
          alert("Please enter a valid received quantity for this transaction.");
          return;
        }

        const computedCumulative = Math.min(dispatchedQty, previouslyReceived + inc);
        const finalStatus = computedCumulative < dispatchedQty ? "Partially Received" : "Completed & Ready";

        onSubmit(selectedId, {
          goodsReceivedDate: data.goodsReceivedDate,
          receivedThisTime: inc,
          receivedQty: computedCumulative,
          receivedUom: unit,
          docRefNo: data.docRefNo.trim(),
          receivedBy: data.receivedBy.trim(),
          inspectedBy: (data.inspectedBy || '').trim(),
          status: finalStatus
        });

        setSelectedId("");
      };

      const ic = `w-full px-3 py-2 rounded-lg border text-xs focus:outline-none focus:border-emerald-500 ${bgInput}`;

      return (
        <div className="max-w-4xl mx-auto space-y-4">
          <div className={`border-b ${borderC} pb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2`}>
            <div>
              <h2 className={`text-lg font-extrabold ${textMain}`}>Item Receiving and Inspection</h2>
              <p className={`text-xs ${textSub} mt-0.5`}>Log received quantities. Completed items are archived from queue.</p>
            </div>
            <span className={`text-xs font-mono font-bold px-3 py-1 rounded-full ${dm?'bg-emerald-950/60 text-emerald-300 border border-emerald-800':'bg-emerald-100 text-emerald-900 border border-emerald-200'}`}>
              {items.length} Pending Receipt
            </span>
          </div>

          <div className={`p-4 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-2`}>
            <label className={`block font-bold text-xs ${textMain}`}>Select Item from Receiving Queue *</label>
            <select
              value={selectedId}
              onChange={e => setSelectedId(e.target.value)}
              className={`${ic} font-mono font-medium`}
            >
              <option value="">-- Choose from {items.length} items awaiting receipt --</option>
              {items.map(i => {
                const pend = Math.max(0, (i.dispatchQty||1) - (i.receivedQty||0));
                return (
                  <option key={i.id} value={i.id}>
                    {i.isUrgent ? '[URGENT] ' : ''}WO: {i.woNumber} | GP #{i.gatePassNo} (POR: {i.porNumber || '-'}) | {i.itemDescription} ({i.serviceProvider}) - [Pending: {pend} {i.dispatchUom}]
                  </option>
                );
              })}
            </select>
          </div>

          {!selectedItem ? (
            <div className={`p-6 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-3`}>
              <div className="flex items-center justify-between">
                <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                  <Icon name="package-check" size={16} className="text-emerald-600" />
                  Items Awaiting Stores Receipt ({items.length})
                </h3>
              </div>
              {items.length === 0 ? (
                <div className="text-center py-10 space-y-2">
                  <Icon name="check-circle-2" size={32} className="text-emerald-500 mx-auto" />
                  <p className={`text-xs font-semibold ${textMain}`}>Receiving Queue is Clear!</p>
                  <p className={`text-[11px] ${textSub}`}>All approved repair items have been fully received and verified.</p>
                </div>
              ) : (
                <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className={`border-b ${borderC} ${textSub} text-[10px] font-bold uppercase`}>
                        <th className="py-2.5 px-3">WO & Gate Pass</th>
                        <th className="py-2.5 px-3">POR #</th>
                        <th className="py-2.5 px-3">Item Description</th>
                        <th className="py-2.5 px-3">Supplier</th>
                        <th className="py-2.5 px-3">Est. Delivery</th>
                        <th className="py-2.5 px-3">Pending Balance</th>
                        <th className="py-2.5 px-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className={`divide-y ${borderC}`}>
                      {items.map(item => {
                        const pend = Math.max(0, (item.dispatchQty||1) - (item.receivedQty||0));
                        return (
                          <tr key={item.id} onClick={()=>setSelectedId(item.id)}
                            className="hover:bg-emerald-50/50 dark:hover:bg-slate-700/40 cursor-pointer transition-colors">
                            <td className="py-2.5 px-3 font-mono">
                              <div className="flex items-center gap-1.5">
                                {item.isUrgent && <span className="px-1.5 py-0.2 rounded bg-rose-600 text-white text-[9px] font-black">URGENT</span>}
                                <span className="font-bold text-sky-600">{item.woNumber}</span>
                              </div>
                              <div className={`text-[10px] ${textSub}`}>GP #{item.gatePassNo}</div>
                            </td>
                            <td className="py-2.5 px-3 font-mono font-bold text-slate-800 dark:text-slate-200">
                              {item.porNumber || '-'}
                            </td>
                            <td className={`py-2.5 px-3 ${textMain} font-medium max-w-[220px] truncate`}>{item.itemDescription}</td>
                            <td className={`py-2.5 px-3 ${textSub}`}>{item.serviceProvider}</td>
                            <td className={`py-2.5 px-3 font-mono ${textSub}`}>{item.estReceiveDate || 'Pending Quote'}</td>
                            <td className="py-2.5 px-3 font-mono font-bold text-amber-600">
                              {pend} / {item.dispatchQty} {item.dispatchUom}
                            </td>
                            <td className="py-2.5 px-3 text-right">
                              <button
                                type="button"
                                onClick={(e)=>{e.stopPropagation(); setSelectedId(item.id);}}
                                className="px-2.5 py-1 text-[11px] font-bold bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg shadow-sm"
                              >
                                Receive
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          ) : (
            <form onSubmit={handleSubmit} className={`p-5 md:p-6 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-5 text-xs animate-fadeIn`}>
              <div className={`p-3.5 rounded-xl ${dm?'bg-slate-700/50 border-slate-600':'bg-sky-50/70 border-sky-200'} border flex flex-col sm:flex-row sm:items-center justify-between gap-2`}>
                <div className="space-y-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    {selectedItem.isUrgent && (
                      <span className="px-2 py-0.5 rounded bg-rose-600 text-white font-black text-[10px] uppercase">
                        URGENT
                      </span>
                    )}
                    <span className="font-mono font-bold text-sky-600">WO: {selectedItem.woNumber}</span>
                    <span className={`font-bold ${textMain}`}>GP #{selectedItem.gatePassNo}</span>
                    <span className="font-mono font-bold text-slate-800 dark:text-slate-200">POR: {selectedItem.porNumber || '-'}</span>
                  </div>
                  <p className={`font-medium ${textMain} truncate`}>{selectedItem.itemDescription}</p>
                  <p className={`text-[11px] ${textSub}`}>
                    Supplier: <strong className={textMain}>{selectedItem.serviceProvider}</strong> | Dispatched: <strong className={textMain}>{selectedItem.dispatchQty} {unit}</strong>
                  </p>
                </div>
                <button type="button" onClick={()=>setSelectedId("")}
                  className={`self-start sm:self-center px-3 py-1 text-[11px] font-semibold rounded-lg border ${borderC} ${textSub} hover:${textMain}`}>
                  Change Selection
                </button>
              </div>

              {/* Quantity Verification Tracker */}
              <div className={`p-4 rounded-xl ${dm?'bg-slate-700/60 border-slate-600':'bg-slate-50 border-slate-200'} border space-y-3`}>
                <div className="flex items-center justify-between">
                  <h4 className={`font-bold ${textMain} flex items-center gap-1.5`}>
                    <Icon name="boxes" size={15} className="text-sky-600" /> Quantity Verification Tracker
                  </h4>
                  {isCompleteNow ? (
                    <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-extrabold text-[11px] border border-emerald-300">
                      Full Quantity Reached (Completed)
                    </span>
                  ) : (
                    <span className="px-2.5 py-0.5 rounded-full bg-orange-100 text-orange-800 font-extrabold text-[11px] border border-orange-300">
                      Partially Received (Pending Balance: {remainingAfter} {unit})
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
                  <div className={`p-2.5 rounded-lg ${dm?'bg-slate-800/80 border-slate-600':'bg-white border-slate-200'} border`}>
                    <span className={`text-[10px] uppercase font-bold block mb-1 ${textSub}`}>Total Dispatched</span>
                    <span className={`text-sm font-bold ${textMain}`}>{dispatchedQty} {unit}</span>
                  </div>

                  <div className={`p-2.5 rounded-lg ${dm?'bg-slate-800/80 border-slate-600':'bg-white border-slate-200'} border`}>
                    <span className={`text-[10px] uppercase font-bold block mb-1 ${textSub}`}>Previously Received</span>
                    <span className="text-sm font-bold text-slate-700 dark:text-slate-300">{previouslyReceived} {unit}</span>
                  </div>

                  <div className={`p-2.5 rounded-lg ${dm?'bg-emerald-950/40 border-emerald-700':'bg-emerald-50 border-emerald-300'} border`}>
                    <span className="text-[10px] uppercase font-bold block mb-1 text-emerald-700 dark:text-emerald-400">Arriving This Time</span>
                    <span className="text-sm font-extrabold text-emerald-700 dark:text-emerald-400">+{thisTimeQty} {unit}</span>
                  </div>

                  <div className={`p-2.5 rounded-lg ${dm?'bg-slate-800/80 border-slate-600':'bg-white border-slate-200'} border`}>
                    <span className={`text-[10px] uppercase font-bold block mb-1 ${textSub}`}>New Cumulative Total</span>
                    <span className="text-sm font-bold text-sky-700 dark:text-sky-400">{newTotal} / {dispatchedQty} {unit}</span>
                  </div>
                </div>

                <div>
                  <div className={`w-full h-3 rounded-full ${dm?'bg-slate-700':'bg-slate-200'} overflow-hidden`}>
                    <div className={`h-3 rounded-full transition-all duration-700 ${isCompleteNow ? 'bg-emerald-500' : 'bg-orange-500'}`} style={{width:`${pct}%`}} />
                  </div>
                  <div className={`flex justify-between text-[10px] ${textSub} mt-1 font-mono`}>
                    <span>0</span>
                    <span className="font-bold">{pct}% cumulative received</span>
                    <span>{dispatchedQty} {unit}</span>
                  </div>
                </div>
              </div>

              {guardrailMsg && (
                <div className="p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2 animate-fadeIn">
                  <Icon name="alert-circle" size={15} />
                  <span>{guardrailMsg}</span>
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${textMain}`}>
                    Item Received Date <span className="text-rose-500">*</span>
                  </label>
                  <input type="date" required value={data.goodsReceivedDate}
                    onChange={e=>setData({...data, goodsReceivedDate:e.target.value})} className={ic} />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${textMain}`}>
                    Received Item <span className="text-rose-500">*</span> <span className={`font-normal ${textSub}`}>(Pending: {pendingBalance})</span>
                  </label>
                  <div className="flex items-center gap-2">
                    <input
                      type="number"
                      min="1"
                      max={pendingBalance}
                      required
                      value={data.receivedThisTime}
                      onChange={e=>handleIncrementChange(e.target.value)}
                      className={`w-full px-3 py-2 rounded-lg border text-xs font-bold focus:outline-none focus:border-emerald-500 ${bgInput}`}
                    />
                    <span className={`px-2.5 py-2 rounded-lg border font-mono text-xs font-bold whitespace-nowrap ${dm ? 'bg-slate-900 border-slate-600 text-slate-100' : 'bg-slate-100 border-slate-200 text-slate-800'}`}>
                      {unit}
                    </span>
                  </div>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${textMain}`}>Doc Ref / Delivery Note #</label>
                  <input type="text" placeholder="e.g. 17128 / DN-982" value={data.docRefNo}
                    onChange={e=>setData({...data, docRefNo:e.target.value})} className={`${ic} font-mono`} />
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${textMain}`}>Received By (Stores Officer)</label>
                  <input type="text" placeholder="Name of stores officer" value={data.receivedBy}
                    onChange={e=>setData({...data, receivedBy:e.target.value})} className={ic} />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${textMain}`}>
                    Inspected By <span className={`font-normal ${textSub}`}>(Optional)</span>
                  </label>
                  <input
                    type="text"
                    placeholder="Name of inspecting officer / engineer"
                    value={data.inspectedBy}
                    onChange={e=>setData({...data, inspectedBy:e.target.value})}
                    className={ic}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${textMain}`}>Lifecycle Status</label>
                  {!isCompleteNow ? (
                    <div className="px-3 py-2 rounded-lg border font-bold text-orange-700 bg-orange-50 dark:bg-orange-950/40 dark:border-orange-800 dark:text-orange-300 flex items-center justify-between">
                      <span>Partially Received</span>
                      <span className="text-[10px] font-normal">({newTotal}/{dispatchedQty} {unit})</span>
                    </div>
                  ) : (
                    <div className="px-3 py-2 rounded-lg border font-bold text-emerald-700 bg-emerald-50 dark:bg-emerald-950/40 dark:border-emerald-800 dark:text-emerald-300 flex items-center justify-between">
                      <span>Completed</span>
                      <span className="text-[10px] font-normal">Ready for service</span>
                    </div>
                  )}
                </div>
              </div>

              <div className={`pt-3 border-t ${borderC} flex items-center justify-between`}>
                <button type="button" onClick={()=>setSelectedId("")}
                  className={`px-4 py-2 rounded-lg ${dm?'bg-slate-700 text-slate-300':'bg-slate-100 text-slate-700'} font-semibold`}>
                  Cancel
                </button>
                <button type="submit"
                  className="px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center gap-2">
                  <Icon name="check-circle" size={16} /><span>Save Receiving Transaction (+{thisTimeQty} {unit})</span>
                </button>
              </div>
            </form>
          )}
        </div>
      );
    }

    // ==========================================
    // MASTER TABLE VIEW
    // ==========================================
    function MasterTableView({ items, totalCount, suppliers, searchTerm, setSearchTerm, statusFilter, setStatusFilter, supplierFilter, setSupplierFilter, focFilter, setFocFilter, urgentFilter, setUrgentFilter, onRowClick, onDeleteClick, canEditDelete, onExport, user, darkMode:dm }) {
      const bgCard=dm?'bg-slate-800':'bg-white'; const borderC=dm?'border-slate-700':'border-slate-200';
      const textMain=dm?'text-slate-100':'text-slate-900'; const textSub=dm?'text-slate-400':'text-slate-600';
      const bgInput=dm?'bg-slate-700 border-slate-600 text-slate-100':'bg-slate-50 border-slate-300 text-slate-900';
      const theadBg=dm?'bg-slate-700':'bg-slate-200';
      const theadText=dm?'text-slate-100':'text-slate-800';

      const distinctWoCount = useMemo(() => {
        return new Set(items.map(i => (i.woNumber || '').trim())).size;
      }, [items]);

      return (
        <div className="space-y-4 max-w-7xl mx-auto">
          <div className={`flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b ${borderC}`}>
            <div>
              <h2 className={`text-lg font-extrabold ${textMain}`}>Master View</h2>
              <p className={`text-xs ${textSub}`}>
                Central registry covering Repair Dispatch, Procurement Process, and Item Receiving and Inspection.
              </p>
            </div>
            <div className="flex items-center gap-2.5">
              <span className={`text-xs font-mono font-bold px-3 py-1 rounded-full ${dm?'bg-slate-700 text-slate-300':'bg-slate-200 text-slate-800'}`}>
                {items.length} rows · {distinctWoCount} distinct WO Numbers
              </span>
              <button onClick={onExport}
                className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-lg shadow-sm transition-all">
                <Icon name="download" size={14} /><span>Export Excel File</span>
              </button>
            </div>
          </div>

          {/* Filter Bar */}
          <div className={`p-4 rounded-xl ${bgCard} border ${borderC} shadow-sm grid grid-cols-2 lg:grid-cols-5 gap-3 text-xs`}>
            <div>
              <label className={`block font-bold uppercase mb-1 ${textSub}`}>Search</label>
              <input type="text" placeholder="WO, POR, Gate Pass, Item..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
                className={`w-full px-3 py-1.5 rounded-lg border focus:outline-none focus:border-sky-500 ${bgInput}`} />
            </div>

            <div>
              <label className={`block font-bold uppercase mb-1 ${textSub}`}>Status Filter</label>
              <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className={`w-full px-3 py-1.5 rounded-lg border focus:outline-none ${bgInput}`}>
                <option value="ALL">All Statuses</option>
                {FILTER_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            <div>
              <label className={`block font-bold uppercase mb-1 ${textSub}`}>Supplier Filter</label>
              <select value={supplierFilter} onChange={e=>setSupplierFilter(e.target.value)} className={`w-full px-3 py-1.5 rounded-lg border focus:outline-none ${bgInput}`}>
                <option value="ALL">All Suppliers</option>
                {suppliers.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            <div>
              <label className={`block font-bold uppercase mb-1 ${textSub}`}>Warranty / FOC</label>
              <select value={focFilter} onChange={e=>setFocFilter(e.target.value)} className={`w-full px-3 py-1.5 rounded-lg border focus:outline-none ${bgInput}`}>
                <option value="ALL">All Items</option>
                <option value="FOC">Warranty / FOC</option>
                <option value="REGULAR">Paid / Standard</option>
              </select>
            </div>

            <div>
              <label className={`block font-bold uppercase mb-1 ${textSub}`}>Priority Filter</label>
              <select value={urgentFilter} onChange={e=>setUrgentFilter(e.target.value)} className={`w-full px-3 py-1.5 rounded-lg border focus:outline-none ${bgInput}`}>
                <option value="ALL">All Priorities</option>
                <option value="URGENT">Urgent Only</option>
                <option value="STANDARD">Standard Priority</option>
              </select>
            </div>
          </div>

          <div className={`rounded-xl ${bgCard} border ${borderC} overflow-hidden shadow-sm`}>
            <div className="overflow-x-auto max-h-[calc(100vh-270px)] overflow-y-auto custom-scrollbar relative">
              <table className="w-full text-left border-collapse text-xs min-w-[1050px]">
                <thead className={`sticky top-0 z-10 shadow-sm ${theadBg} ${theadText} border-b ${borderC} font-black uppercase`}>
                  <tr>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>WO & Gate Pass</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>POR #</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>Item Description</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>Supplier</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>Dispatch Details</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>Procurement Process</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>Receiving Log</th>
                    <th className={`py-3 px-3.5 text-[10px] ${theadBg} ${theadText}`}>Status</th>
                    <th className={`py-3 px-3.5 text-[10px] text-right ${theadBg} ${theadText}`}>Actions</th>
                  </tr>
                </thead>
                <tbody className={`divide-y ${borderC} font-medium`}>
                  {items.length === 0 ? (
                    <tr>
                      <td colSpan={9} className={`py-12 text-center ${textSub}`}>
                        No repair items match the current search filters.
                      </td>
                    </tr>
                  ) : (
                    items.map(item => {
                      const isReceived = item.status === "Completed & Ready" || item.status === "Received at Stores";
                      const isPartial = item.status === "Partially Received";

                      const rowBorder = isReceived
                        ? 'border-l-4 border-l-emerald-500'
                        : isPartial
                        ? 'border-l-4 border-l-orange-500'
                        : 'border-l-4 border-l-amber-500';

                      const rowBg = dm
                        ? 'bg-slate-800 hover:bg-slate-700/90 text-slate-100'
                        : 'bg-white hover:bg-sky-50 text-slate-900';

                      return (
                        <tr key={item.id} className={`${rowBorder} ${rowBg} border-b ${borderC} transition-colors`}>
                          <td className="py-3 px-3.5">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              {item.isUrgent && (
                                <span className="px-1.5 py-0.2 rounded bg-rose-600 text-white font-black text-[9px] uppercase tracking-wider">
                                  URGENT
                                </span>
                              )}
                              <span className={`font-mono font-extrabold ${dm?'text-sky-400':'text-sky-700'}`}>{item.woNumber}</span>
                            </div>
                            <div className={`font-mono text-[11px] font-semibold ${textSub}`}>GP #{item.gatePassNo}</div>
                            {item.isFoc && (
                              <span className="inline-block mt-0.5 px-1.5 py-0.2 rounded bg-purple-700 text-white font-extrabold text-[9px] uppercase">
                                FOC
                              </span>
                            )}
                          </td>

                          <td className="py-3 px-3.5 font-mono font-bold text-slate-800 dark:text-slate-200">
                            {item.porNumber || '-'}
                          </td>

                          <td className="py-3 px-3.5 max-w-[200px]">
                            <div className={`${textMain} font-bold truncate`} title={item.itemDescription}>
                              {item.itemDescription}
                            </div>
                            {item.serialModelNo && (
                              <div className={`text-[10px] font-mono ${textSub} truncate`}>
                                S/N: {item.serialModelNo}
                              </div>
                            )}
                            {item.focDescription && (
                              <div className="text-[10px] text-purple-700 dark:text-purple-300 italic truncate" title={item.focDescription}>
                                Note: {item.focDescription}
                              </div>
                            )}
                          </td>

                          <td className={`py-3 px-3.5 ${textMain} font-semibold max-w-[130px] truncate`}>
                            {item.serviceProvider}
                          </td>

                          <td className="py-3 px-3.5 font-mono">
                            <div className={`${textMain} font-bold`}>
                              {item.dispatchQty} {item.dispatchUom || 'Each'}
                            </div>
                            <div className={`text-[10px] ${textSub}`}>{item.dispatchDate || '-'}</div>
                            {item.takenBy && <div className={`text-[9px] ${textSub}`}>By: {item.takenBy}</div>}
                          </td>

                          <td className="py-3 px-3.5 font-mono text-[11px]">
                            <div className="font-bold text-purple-700 dark:text-purple-400">
                              {item.procurementStage || 'Pending Quotation'}
                            </div>
                            {item.poNumber && (
                              <div className="text-[10px] text-slate-700 dark:text-slate-300">
                                PO: {item.poNumber}
                              </div>
                            )}
                            {item.estReceiveDate ? (
                              <div className={`text-[10px] ${textSub}`}>Est: {item.estReceiveDate}</div>
                            ) : (
                              <span className={`text-[10px] ${textSub} italic`}>Pending Quote</span>
                            )}
                          </td>

                          <td className="py-3 px-3.5 font-mono">
                            <div className={isReceived ? "text-emerald-700 dark:text-emerald-400 font-extrabold" : isPartial ? "text-orange-700 dark:text-orange-400 font-extrabold" : textSub}>
                              {item.receivedQty || 0} / {item.dispatchQty} {item.receivedUom || item.dispatchUom}
                            </div>
                            {item.goodsReceivedDate && (
                              <div className={`text-[10px] ${textSub}`}>DOR: {item.goodsReceivedDate}</div>
                            )}
                            {item.inspectedBy && (
                              <div className="text-[9px] text-teal-700 dark:text-teal-400 font-semibold truncate">
                                Insp: {item.inspectedBy}
                              </div>
                            )}
                          </td>

                          <td className="py-3 px-3.5">
                            <StatusBadge status={item.status} isFoc={item.isFoc} isUrgent={item.isUrgent} />
                          </td>

                          <td className="py-3 px-3.5 text-right">
                            <div className="flex items-center justify-end gap-1.5">
                              {canEditDelete ? (
                                <>
                                  <button
                                    type="button"
                                    onClick={()=>onRowClick(item)}
                                    className={`px-2.5 py-1 rounded text-xs font-bold border ${dm?'bg-slate-700 hover:bg-slate-600 text-slate-200 border-slate-600':'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300'} transition-all`}
                                    title="Edit Line Item"
                                  >
                                    Edit
                                  </button>
                                  <button
                                    type="button"
                                    onClick={()=>onDeleteClick(item)}
                                    className="p-1 rounded text-xs font-semibold text-rose-600 hover:bg-rose-100 dark:hover:bg-rose-950/40 border border-transparent hover:border-rose-300 transition-all"
                                    title="Delete Line Item"
                                  >
                                    <Icon name="trash-2" size={14} />
                                  </button>
                                </>
                              ) : (
                                <button
                                  type="button"
                                  onClick={()=>onRowClick(item)}
                                  className={`px-2.5 py-1 rounded text-xs font-bold border ${dm?'bg-slate-700 hover:bg-slate-600 text-slate-200 border-slate-600':'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300'}`}
                                >
                                  View
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // ITEM EDIT MODAL
    // ==========================================
    function ItemEditModal({ item, allItems = [], suppliers, uoms, onAddUom, canEditDelete, onClose, onSave, onDelete, user, darkMode:dm }) {
      const [edited, setEdited] = useState({...item});
      const [dateError, setDateError] = useState("");
      const [qtyError, setQtyError] = useState("");

      const bgCard=dm?'bg-slate-800':'bg-white'; const borderC=dm?'border-slate-700':'border-slate-200';
      const textMain=dm?'text-slate-100':'text-slate-900'; const textSub=dm?'text-slate-400':'text-slate-600';
      const bgInput=dm?'bg-slate-700 border-slate-600 text-slate-100':'bg-slate-50 border-slate-300 text-slate-900';
      const ic = `w-full px-3 py-2 rounded-lg border text-xs focus:outline-none focus:border-sky-500 ${bgInput}`;

      const handleRecDateCheck = (field, val) => {
        const updated = { ...edited, [field]: val };
        if (updated.quotationRecDate && updated.quotationAppDate && updated.quotationRecDate > updated.quotationAppDate) {
          setDateError("Quotation Received Date cannot be after Quotation Approved Date.");
        } else {
          setDateError("");
        }
        setEdited(updated);
      };

      const handleQtyChange = val => {
        let num = parseInt(val, 10);
        if (isNaN(num)) num = 0;
        const max = edited.dispatchQty || 1;
        if (num > max) {
          num = max;
          setQtyError(`Received quantity cannot exceed dispatched quantity (${max}). Clamped.`);
        } else {
          setQtyError("");
        }
        const autoStatus = num >= max ? "Completed & Ready" : (num > 0 ? "Partially Received" : "In Repair / Out at Supplier");
        setEdited({ ...edited, receivedQty: num, status: autoStatus });
      };

      const handleSave = () => {
        if (!edited.porNumber || !edited.porNumber.trim()) {
          alert("POR Number cannot be empty!");
          return;
        }
        if (dateError) {
          alert(dateError);
          return;
        }
        onSave(edited);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <div className={`w-full max-w-2xl ${bgCard} border ${borderC} rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]`}>
            <div className={`px-6 py-4 ${dm?'bg-slate-700/50':'bg-slate-100'} border-b ${borderC} flex items-center justify-between`}>
              <div>
                <div className="flex items-center gap-2">
                  <h3 className={`font-extrabold ${textMain} font-mono`}>WO: {edited.woNumber} | GP #{edited.gatePassNo}</h3>
                  {edited.isUrgent && <span className="px-2 py-0.5 rounded bg-rose-600 text-white font-black text-[9px] uppercase">URGENT</span>}
                </div>
                <p className={`text-xs ${textSub}`}>{edited.itemDescription}</p>
              </div>
              <button onClick={onClose}><Icon name="x" size={20} /></button>
            </div>

            <div className="p-6 overflow-y-auto space-y-4 text-xs custom-scrollbar">
              {!canEditDelete && (
                <div className={`p-3 rounded-lg ${dm?'bg-amber-950/40 text-amber-300 border-amber-800':'bg-amber-100 text-amber-950 border-amber-300'} font-bold border`}>
                  Stores Officer: Read-only view. Edit and Delete actions are restricted to Procurement and Administrator.
                </div>
              )}

              {qtyError && (
                <div className="p-2.5 rounded-lg bg-rose-100 border border-rose-300 text-rose-900 text-xs font-bold">
                  {qtyError}
                </div>
              )}

              {dateError && (
                <div className="p-2.5 rounded-lg bg-rose-100 border border-rose-300 text-rose-900 text-xs font-bold">
                  {dateError}
                </div>
              )}

              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className={`text-[10px] font-black uppercase tracking-wider text-sky-700 dark:text-sky-400 block`}>Repair Dispatch Details</span>
                  <label className="flex items-center gap-2 cursor-pointer font-bold text-xs">
                    <input
                      type="checkbox"
                      disabled={!canEditDelete}
                      checked={Boolean(edited.isUrgent)}
                      onChange={e=>setEdited({...edited, isUrgent:e.target.checked})}
                      className="w-4 h-4 rounded text-rose-600"
                    />
                    <span className={edited.isUrgent ? "text-rose-600 font-extrabold" : textSub}>Mark as Urgent</span>
                  </label>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Work Order #</label>
                    <input
                      type="text"
                      disabled={!canEditDelete}
                      value={edited.woNumber||''}
                      onChange={e=>setEdited({...edited, woNumber:e.target.value})}
                      className={`${ic} font-mono`}
                    />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>POR Number <span className="text-rose-500">*</span></label>
                    <input
                      type="text"
                      required
                      disabled={!canEditDelete}
                      value={edited.porNumber||''}
                      onChange={e=>setEdited({...edited, porNumber:e.target.value})}
                      className={`${ic} font-mono font-bold`}
                    />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Gate Pass #</label>
                    <input type="text" disabled={!canEditDelete} value={edited.gatePassNo||''} onChange={e=>setEdited({...edited,gatePassNo:e.target.value})} className={`${ic} font-mono`} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Dispatch Date</label>
                    <input type="date" disabled={!canEditDelete} value={edited.dispatchDate||''} onChange={e=>setEdited({...edited,dispatchDate:e.target.value})} className={ic} />
                  </div>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${textSub}`}>Item Description</label>
                  <input type="text" disabled={!canEditDelete} value={edited.itemDescription||''} onChange={e=>setEdited({...edited,itemDescription:e.target.value})} className={ic} />
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Dispatched Qty</label>
                    <input type="number" min="1" disabled={!canEditDelete} value={edited.dispatchQty||1}
                      onChange={e=>setEdited({...edited, dispatchQty:Math.max(1, parseInt(e.target.value)||1)})} className={`${ic} font-bold`} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>UOM</label>
                    <select disabled={!canEditDelete} value={edited.dispatchUom||'Each'} onChange={e=>setEdited({...edited, dispatchUom:e.target.value})} className={ic}>
                      {uoms.map(u=><option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Supplier</label>
                    <select disabled={!canEditDelete} value={edited.serviceProvider||''} onChange={e=>setEdited({...edited, serviceProvider:e.target.value})} className={ic}>
                      {suppliers.map(s=><option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {/* Procurement Process Section */}
              <div className={`p-4 rounded-xl border ${borderC} ${dm?'bg-slate-700/40':'bg-slate-50'} space-y-3`}>
                <div className="flex items-center justify-between">
                  <h4 className={`font-bold text-xs ${textMain} text-purple-700 dark:text-purple-400`}>
                    Procurement Process Milestones
                  </h4>
                  <div className="flex items-center gap-2">
                    <label className={`text-[11px] font-bold ${textSub}`}>Stage:</label>
                    <select
                      disabled={!canEditDelete}
                      value={edited.procurementStage || 'Pending Quotation'}
                      onChange={e=>setEdited({...edited, procurementStage: e.target.value})}
                      className="px-2 py-1 rounded border text-xs font-bold bg-white dark:bg-slate-800"
                    >
                      {PROCUREMENT_STAGES.map(st => <option key={st} value={st}>{st}</option>)}
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Quotation Rec. Date</label>
                    <input type="date" disabled={!canEditDelete} value={edited.quotationRecDate||''}
                      onChange={e=>handleRecDateCheck('quotationRecDate', e.target.value)} className={ic} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Quotation App. Date</label>
                    <input type="date" disabled={!canEditDelete} value={edited.quotationAppDate||''}
                      onChange={e=>handleRecDateCheck('quotationAppDate', e.target.value)} className={ic} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>PO Number</label>
                    <input type="text" disabled={!canEditDelete} value={edited.poNumber||''}
                      onChange={e=>setEdited({...edited, poNumber:e.target.value})} className={`${ic} font-mono`} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Est. Receive Date</label>
                    <input type="date" disabled={!canEditDelete} value={edited.estReceiveDate||''}
                      onChange={e=>setEdited({...edited, estReceiveDate:e.target.value})} className={ic} />
                  </div>
                </div>
                <div>
                  <label className={`block font-bold mb-1 ${textSub}`}>Procurement Remarks</label>
                  <textarea rows={2} disabled={!canEditDelete} value={edited.procurementRemarks||''}
                    onChange={e=>setEdited({...edited, procurementRemarks:e.target.value})} className={ic} />
                </div>
              </div>

              {/* Receiving & Inspection Section */}
              <div className={`p-4 rounded-xl border ${borderC} ${dm?'bg-slate-700/40':'bg-slate-50'} space-y-3`}>
                <h4 className={`font-bold text-xs ${textMain} text-emerald-700 dark:text-emerald-400`}>
                  Item Receiving & Inspection
                </h4>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Item Received Date</label>
                    <input type="date" disabled={!canEditDelete} value={edited.goodsReceivedDate||''}
                      onChange={e=>setEdited({...edited, goodsReceivedDate:e.target.value})} className={ic} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Received Qty (Max: {edited.dispatchQty})</label>
                    <input type="number" min="0" max={edited.dispatchQty} disabled={!canEditDelete} value={edited.receivedQty||0}
                      onChange={e=>handleQtyChange(e.target.value)} className={`${ic} font-bold text-emerald-700 dark:text-emerald-400`} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Doc Ref #</label>
                    <input type="text" disabled={!canEditDelete} value={edited.docRefNo||''}
                      onChange={e=>setEdited({...edited, docRefNo:e.target.value})} className={ic} />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${textSub}`}>Inspected By</label>
                    <input type="text" disabled={!canEditDelete} value={edited.inspectedBy||''}
                      onChange={e=>setEdited({...edited, inspectedBy:e.target.value})} className={ic} />
                  </div>
                </div>
                <div>
                  <label className={`block font-bold mb-1 ${textSub}`}>Lifecycle Status</label>
                  <select disabled={!canEditDelete} value={edited.status||''} onChange={e=>setEdited({...edited, status:e.target.value})} className={`${ic} font-bold`}>
                    <option value="In Repair / Out at Supplier">In Repair / Out at Supplier</option>
                    <option value="Partially Received">Partially Received</option>
                    <option value="Completed & Ready">Completed & Ready</option>
                  </select>
                </div>
              </div>

            </div>

            <div className={`px-6 py-4 ${dm?'bg-slate-700/50':'bg-slate-100'} border-t ${borderC} flex items-center justify-between`}>
              <div className="flex items-center gap-2">
                <button onClick={onClose} className={`px-4 py-2 rounded-lg ${dm?'bg-slate-600 text-slate-200':'bg-slate-200 text-slate-800'} font-bold`}>
                  Close
                </button>
                {canEditDelete && (
                  <button
                    type="button"
                    onClick={() => { onClose(); onDelete(edited); }}
                    className="px-3 py-2 rounded-lg text-rose-600 hover:bg-rose-100 dark:hover:bg-rose-950/40 font-bold flex items-center gap-1.5 transition-all"
                  >
                    <Icon name="trash-2" size={14} />
                    <span>Delete Item</span>
                  </button>
                )}
              </div>
              {canEditDelete && (
                <button
                  onClick={handleSave}
                  className="px-6 py-2 rounded-lg bg-sky-700 hover:bg-sky-800 text-white font-bold transition-all"
                >
                  Save Changes
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
