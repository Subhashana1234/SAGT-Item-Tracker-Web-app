    function exportToCSV(items, filename="SAGT_Repair_Export.csv") {
      const headers = [
        "ID", "Work Order Number", "POR Number", "Gate Pass #", "Urgent", "Dispatch Date", "Item Description", "Serial No", "Service Provider",
        "Dispatch Qty", "UOM", "Taken By", "Warranty / FOC", "FOC Master WO", "FOC Description",
        "Procurement Stage", "PO Number", "Quotation Rec Date", "Quotation App Date", "Est Receive Date", "Procurement Remarks",
        "Item Received Date", "Received Qty", "Pending Qty", "Received UOM", "Doc Ref No", "Received By", "Inspected By", "Status"
      ];
      const rows = items.map(i => {
        const dispQty = i.dispatchQty || 1;
        const recQty = i.receivedQty || 0;
        const pendingQty = Math.max(0, dispQty - recQty);
        return [
          i.id,
          `"${(i.woNumber||'').replace(/"/g,'""')}"`,
          `"${(i.porNumber||'').replace(/"/g,'""')}"`,
          i.gatePassNo,
          i.isUrgent ? 'YES (URGENT)' : 'NO',
          i.dispatchDate || '',
          `"${(i.itemDescription||'').replace(/"/g,'""')}"`,
          `"${(i.serialModelNo||'').replace(/"/g,'""')}"`,
          `"${(i.serviceProvider||'').replace(/"/g,'""')}"`,
          dispQty,
          i.dispatchUom || 'Each',
          `"${(i.takenBy||'').replace(/"/g,'""')}"`,
          i.isFoc ? 'YES (FOC)' : 'NO (Standard)',
          `"${(i.focMasterWo||'').replace(/"/g,'""')}"`,
          `"${(i.focDescription||'').replace(/"/g,'""')}"`,
          `"${(i.procurementStage||'').replace(/"/g,'""')}"`,
          `"${(i.poNumber||'').replace(/"/g,'""')}"`,
          i.quotationRecDate || '',
          i.quotationAppDate || '',
          i.estReceiveDate || '',
          `"${(i.procurementRemarks||'').replace(/"/g,'""')}"`,
          i.goodsReceivedDate || '',
          recQty,
          pendingQty,
          i.receivedUom || i.dispatchUom || 'Each',
          `"${(i.docRefNo||'').replace(/"/g,'""')}"`,
          `"${(i.receivedBy||'').replace(/"/g,'""')}"`,
          `"${(i.inspectedBy||'').replace(/"/g,'""')}"`,
          i.status
        ];
      });
      const csv = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
      const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
      URL.revokeObjectURL(url);
    }

    function normalizeItem(i) {
      let stage = i.procurementStage || "Pending Quotation";

      if (stage === "Pending PO") stage = "Pending Purchase Order";

      return {
        ...i,
        woNumber: i.woNumber || '',
        porNumber: i.porNumber || '',
        focDescription: i.focDescription || '',
        isUrgent: Boolean(i.isUrgent),
        procurementStage: stage,
        poNumber: i.poNumber || '',
        inspectedBy: i.inspectedBy || '',
        receivedThisTime: typeof i.receivedThisTime === 'number' ? i.receivedThisTime : (i.receivedQty || 0),
        receivedQty: typeof i.receivedQty === 'number' ? i.receivedQty : 0,
        dispatchQty: typeof i.dispatchQty === 'number' ? i.dispatchQty : 1,
        status: i.status || "In Repair / Out at Supplier"
      };
    }

                <input type="password" required value={currentPass} onChange={e=>setCurrentPass(e.target.value)} className={`w-full px-3 py-2 rounded-lg border ${bgInput}`} /></div>
              <div><label className={`block font-medium mb-1 ${textMain}`}>New Password</label>
                <input type="password" required value={newPass} onChange={e=>setNewPass(e.target.value)} className={`w-full px-3 py-2 rounded-lg border ${bgInput}`} /></div>
              <div className="pt-2 flex justify-end gap-2">
                <button type="button" onClick={onClose} className={`px-4 py-2 rounded-lg ${dm?'bg-slate-700 text-slate-300':'bg-slate-100 text-slate-700'} font-semibold`}>Cancel</button>
                <button type="submit" className="px-4 py-2 bg-sky-700 text-white font-bold rounded-lg">Update Password</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // UPDATED DASHBOARD VIEW
    // ==========================================
    function DashboardView({ items, setActiveTab, onSelect, onKpiDrill, user, darkMode:dm }) {
      const bgCard=dm?'bg-slate-800':'bg-white'; const borderC=dm?'border-slate-700':'border-slate-200';
      const textMain=dm?'text-slate-100':'text-slate-900'; const textSub=dm?'text-slate-400':'text-slate-500';

      const [selectedStageStatus, setSelectedStageStatus] = useState(null);

      const todayStr = useMemo(() => {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }, []);

      // Calculate statistics
      // Urgent in KPI: ONLY active urgent items (automatically removed once completed)
      const stats = useMemo(() => {
        const total = items.length;
        const inRepair = items.filter(i=>i.status==="In Repair / Out at Supplier").length;
        const activeUrgent = items.filter(i => Boolean(i.isUrgent) && i.status !== "Completed & Ready" && i.status !== "Received at Stores").length;
        const completed = items.filter(i=>i.status==="Completed & Ready" || i.status==="Received at Stores").length;
        const foc = items.filter(i=>i.isFoc).length;

        // Procurement stages counts
        const pendingQuotation = items.filter(i => (i.procurementStage === "Pending Quotation" || !i.procurementStage) && i.status !== "Completed & Ready" && i.status !== "Received at Stores").length;
        const pendingApproval = items.filter(i => i.procurementStage === "Pending Quotation Approval" && i.status !== "Completed & Ready" && i.status !== "Received at Stores").length;
        const pendingPO = items.filter(i => i.procurementStage === "Pending Purchase Order" && i.status !== "Completed & Ready" && i.status !== "Received at Stores").length;

        return {
          total,
          inRepair,
          activeUrgent,
          completed,
          foc,
          pendingQuotation,
          pendingApproval,
          pendingPO
        };
      }, [items]);

      // Active repair workload by supplier
      const activeSuppliers = useMemo(() => {
        const map = {};
        items.forEach(i=>{ 
          if(i.status === "In Repair / Out at Supplier" && i.serviceProvider) {
            map[i.serviceProvider] = (map[i.serviceProvider] || 0) + 1;
          }
        });
        return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
      }, [items]);

      const maxActiveSup = activeSuppliers[0]?.[1] || 1;
      const completionPct = stats.total > 0 ? Math.round((stats.completed / stats.total) * 100) : 0;

      // Delayed Items live detection
      const delayedItems = useMemo(() => {
        return items.filter(i => {
          return Boolean(i.estReceiveDate) &&
            i.estReceiveDate < todayStr &&
            i.status !== "Completed & Ready" &&
            i.status !== "Received at Stores";
        }).map(item => {
          const diffMs = new Date(todayStr) - new Date(item.estReceiveDate);
          const days = Math.max(1, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
          return { ...item, daysOverdue: days };
        }).sort((a,b) => b.daysOverdue - a.daysOverdue);
      }, [items, todayStr]);

      // Real Year-by-Year completion rates & receipt verification
      const yearlyStats = useMemo(() => {
        const years = [2024, 2025, 2026, 2027];
        return years.map(yr => {
          const yrStr = String(yr);
          const yearItems = items.filter(i => (i.dispatchDate || '').startsWith(yrStr));
          const totalInYear = yearItems.length;
          const completedInYear = yearItems.filter(i => i.status === "Completed & Ready" || i.status === "Received at Stores").length;
          const pendingInYear = totalInYear - completedInYear;
          const rate = totalInYear > 0 ? Math.round((completedInYear / totalInYear) * 100) : 0;

          let statusText = "0 Items Logged";
          let statusType = "empty"; // 'empty', 'all_received', 'pending'

          if (totalInYear === 0) {
            statusText = "0 Items (0%)";
            statusType = "empty";
          } else if (completedInYear === totalInYear) {
            statusText = "All Received";
            statusType = "all_received";
          } else {
            statusText = `${pendingInYear} Pending`;
            statusType = "pending";
          }

          return {
            year: yr,
            total: totalInYear,
            completed: completedInYear,
            pending: pendingInYear,
            rate,
            statusText,
            statusType
          };
        });
      }, [items]);

      // Larger Donut Chart calculation
      const donutData = useMemo(() => {
        const segments = [
          { label: "Completed & Ready", count: stats.completed, color: "#10b981" },
          { label: "In Repair / Out at Supplier", count: stats.inRepair, color: "#f59e0b" }
        ].filter(s => s.count > 0);

        const r = 74;
        const circ = 2 * Math.PI * r;
        let cumulative = 0;

        return segments.map(seg => {
          const pct = stats.total > 0 ? seg.count / stats.total : 0;
          const strokeDasharray = `${(pct * circ).toFixed(2)} ${circ.toFixed(2)}`;
          const strokeDashoffset = (-cumulative * circ).toFixed(2);
          cumulative += pct;
          return { ...seg, pct: Math.round(pct * 100), strokeDasharray, strokeDashoffset };
        });
      }, [stats]);

      const pctStr = (count) => stats.total > 0 ? `${Math.round((count / stats.total) * 100)}%` : '0%';

      // Formal Vertical Bar Chart for Procurement & Completion Stages
      const formalBarItems = useMemo(() => {
        const list = [
          {
            stage: "Pending Quotation",
            code: "STAGE 1",
            label: "Pending Quotation",
            count: stats.pendingQuotation,
            barColor: "#f59e0b",
            bgFill: "bg-amber-500",
            borderStyle: "border-amber-500",
            badgeStyle: "text-amber-800 bg-amber-100 border-amber-300 dark:bg-amber-950/80 dark:text-amber-300 dark:border-amber-700"
          },
          {
            stage: "Pending Quotation Approval",
            code: "STAGE 2",
            label: "Pending Quotation Approval",
            count: stats.pendingApproval,
            barColor: "#6366f1",
            bgFill: "bg-indigo-500",
            borderStyle: "border-indigo-500",
            badgeStyle: "text-indigo-800 bg-indigo-100 border-indigo-300 dark:bg-indigo-950/80 dark:text-indigo-300 dark:border-indigo-700"
          },
          {
            stage: "Pending Purchase Order",
            code: "STAGE 3",
            label: "Pending Purchase Order",
            count: stats.pendingPO,
            barColor: "#0284c7",
            bgFill: "bg-sky-500",
            borderStyle: "border-sky-500",
            badgeStyle: "text-sky-800 bg-sky-100 border-sky-300 dark:bg-sky-950/80 dark:text-sky-300 dark:border-sky-700"
          },

        ];
        const activeTotal = list.reduce((s, x) => s + x.count, 0);
        const maxVal = Math.max(...list.map(x=>x.count), 1);
        return list.map(item => ({
          ...item,
          pct: activeTotal > 0 ? Math.round((item.count / activeTotal) * 100) : 0,
          heightPct: Math.max(10, Math.round((item.count / maxVal) * 100))
        }));
      }, [stats]);

      // Items filtered by clicked vertical bar
      const filteredStageItems = useMemo(() => {
        if (!selectedStageStatus) return [];
        if (selectedStageStatus === "Completed & Ready") {
          return items.filter(i => i.status === "Completed & Ready" || i.status === "Received at Stores");
        }
        return items.filter(i => (i.procurementStage || "Pending Quotation") === selectedStageStatus && i.status !== "Completed & Ready" && i.status !== "Received at Stores");
      }, [items, selectedStageStatus]);

      return (
        <div className="max-w-7xl mx-auto space-y-6">

          {/* ======================================================== */}
          {/* ROW 1: 5 SQUARE KPI CARDS WITH HIGH-CONTRAST COLORS */}
          {/* ======================================================== */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3.5">
            {[
              {
                label: "TOTAL REPAIR ITEMS",
                val: stats.total,
                pct: null,
                color: "text-sky-600 dark:text-sky-400",
                icon: "package",
                desc: "Central registry items",
                pctClass: "bg-sky-50 text-sky-800 border border-sky-300 dark:bg-sky-950/80 dark:text-sky-300 dark:border-sky-700",
                filter: { status:'ALL', foc:'ALL', urgent:'ALL' }
              },
              {
                label: "IN REPAIR",
                val: stats.inRepair,
                pct: pctStr(stats.inRepair),
                color: "text-amber-600 dark:text-amber-400",
                icon: "wrench",
                desc: "Active out at suppliers",
                pctClass: "bg-amber-50 text-amber-800 border border-amber-300 dark:bg-amber-950/80 dark:text-amber-300 dark:border-amber-700",
                filter: { status:'In Repair / Out at Supplier' }
              },
              {
                label: "URGENT ITEMS",
                val: stats.activeUrgent,
                pct: pctStr(stats.activeUrgent),
                color: "text-rose-600 dark:text-rose-400",
                icon: "alert-triangle",
                desc: "Active urgent pending",
                pctClass: "bg-rose-50 text-rose-800 border border-rose-300 dark:bg-rose-950/80 dark:text-rose-300 dark:border-rose-700",
                filter: { urgent:'URGENT' }
              },
              {
                label: "COMPLETED",
                val: stats.completed,
                pct: pctStr(stats.completed),
                color: "text-emerald-600 dark:text-emerald-400",
                icon: "check-circle",
                desc: "Fully received & ready",
                pctClass: "bg-emerald-50 text-emerald-800 border border-emerald-300 dark:bg-emerald-950/80 dark:text-emerald-300 dark:border-emerald-700",
                filter: { status:'Completed & Ready' }
              },
              {
                label: "WARRANTY / FOC",
                val: stats.foc,
                pct: pctStr(stats.foc),
                color: "text-purple-600 dark:text-purple-400",
                icon: "shield-check",
                desc: "Free of charge repairs",
                pctClass: "bg-purple-50 text-purple-800 border border-purple-300 dark:bg-purple-950/80 dark:text-purple-300 dark:border-purple-700",
                filter: { foc:'FOC' }
              },
            ].map(k => (
              <div
                key={k.label}
                onClick={()=>onKpiDrill(k.filter)}
                className={`p-3.5 rounded-xl ${bgCard} border ${borderC} shadow-sm relative overflow-hidden flex flex-col justify-between cursor-pointer hover:shadow-md hover:scale-[1.01] hover:border-sky-400 dark:hover:border-sky-600 transition-all min-h-[128px]`}
                title={`Click to filter Master View by ${k.label}`}
              >
                <div className="flex items-center justify-between">
                  <span className={`text-[11px] font-black tracking-wider ${k.color}`}>{k.label}</span>
                  <div className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                    <Icon name={k.icon} size={15} />
                  </div>
                </div>

                <div className="flex items-center justify-between my-1">
                  <div className={`text-4xl font-black ${k.color} tracking-tight ${k.pct ? 'pl-3.5 sm:pl-5' : 'pl-6 sm:pl-8'}`}>
                    {k.val}
                  </div>
                  {k.pct && (
                    <span className={`px-2.5 py-0.5 rounded-full text-xs font-black ${k.pctClass}`}>
                      {k.pct}
                    </span>
                  )}
                </div>

                <div className={`text-[10px] ${textSub} flex items-center justify-between font-medium`}>
                  <span>{k.desc}</span>
                  <Icon name="arrow-up-right" size={12} className="opacity-50" />
                </div>
              </div>
            ))}
          </div>

          {/* ======================================================== */}
          {/* ROW 2: LARGE DONUT CHART WITH CORNER TEXT LEGEND + ACTIVE REPAIR WORKLOAD */}
          {/* ======================================================== */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
            {/* Prominently Large Donut Chart (5 cols) */}
            <div className={`lg:col-span-5 p-5 rounded-2xl ${bgCard} border ${borderC} shadow-sm flex flex-col justify-between`}>
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100 dark:border-slate-700">
                <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                  <Icon name="pie-chart" size={17} className="text-sky-500" />
                  Status Distribution
                </h3>
                {/* Clean Text Legend in the Corner */}
                <div className="flex flex-wrap items-center gap-3 text-xs">
                  {donutData.map(d => (
                    <div key={d.label} className="flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: d.color }}></span>
                      <span className={`text-[11px] font-semibold ${textSub}`}>{d.label}:</span>
                      <span className="font-mono font-black text-xs" style={{ color: d.color }}>{d.count} ({d.pct}%)</span>
                    </div>
                  ))}
                </div>
              </div>

              {stats.total === 0 ? (
                <p className={`text-xs ${textSub} text-center py-16`}>No items tracked yet.</p>
              ) : (
                <div className="py-6 flex items-center justify-center">
                  {/* Significantly Larger Central Donut Visualization */}
                  <div className="relative w-64 h-64 flex-shrink-0 flex items-center justify-center">
                    <svg className="w-full h-full transform -rotate-90 drop-shadow-sm" viewBox="0 0 180 180">
                      <circle cx="90" cy="90" r="74" fill="transparent" stroke={dm?"#334155":"#e2e8f0"} strokeWidth="20" />
                      {donutData.map((seg, idx) => (
                        <circle
                          key={idx}
                          cx="90" cy="90" r="74"
                          fill="transparent"
                          stroke={seg.color}
                          strokeWidth="20"
                          strokeDasharray={seg.strokeDasharray}
                          strokeDashoffset={seg.strokeDashoffset}
                          strokeLinecap="round"
                          className="transition-all duration-700 ease-out"
                        />
                      ))}
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                      <span className={`text-4xl font-black ${textMain} tracking-tight`}>{stats.total}</span>
                      <span className={`text-[10px] font-extrabold uppercase tracking-widest ${textSub} mt-0.5`}>
                        Total Items
                      </span>
                    </div>
                  </div>
                </div>
              )}

              <div className="pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-[11px] text-slate-500 font-medium">
                <span>In Repair: <strong className="text-amber-600 dark:text-amber-400 font-bold">{stats.inRepair}</strong></span>
                <span>Completed: <strong className="text-emerald-600 dark:text-emerald-400 font-bold">{stats.completed}</strong></span>
              </div>
            </div>

            {/* Active Repair Workload by Supplier (7 cols) */}
            <div className={`lg:col-span-7 p-5 rounded-2xl ${bgCard} border ${borderC} shadow-sm flex flex-col justify-between`}>
              <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                <div>
                  <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                    <Icon name="bar-chart-2" size={17} className="text-purple-500" /> Active Repair Workload by Supplier
                  </h3>
                  <p className={`text-[10px] ${textSub}`}>Counts only items currently out at supplier (In Repair)</p>
                </div>
                <span className={`text-xs ${textSub} font-mono font-bold`}>{activeSuppliers.length} active suppliers</span>
              </div>

              {activeSuppliers.length === 0 ? (
                <div className="text-center py-16 space-y-1">
                  <p className={`text-xs ${textSub}`}>No items currently in active repair at any supplier.</p>
                </div>
              ) : (
                <div className="space-y-4 py-3">
                  {activeSuppliers.map(([name, count]) => {
                    const supPct = Math.round((count / maxActiveSup) * 100);
                    return (
                      <div key={name} className="space-y-1.5">
                        <div className="flex items-center justify-between text-xs">
                          <span className={`font-semibold ${textMain} truncate max-w-[260px]`}>{name}</span>
                          <span className="font-mono font-bold text-purple-600 dark:text-purple-400">
                            {count} <span className={`font-normal text-[10px] ${textSub}`}>active repair{count > 1 ? 's' : ''}</span>
                          </span>
                        </div>
                        <div className={`w-full h-3 rounded-full ${dm?'bg-slate-700':'bg-slate-100'} overflow-hidden shadow-inner`}>
                          <div className="h-3 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 transition-all duration-700" style={{width: `${supPct}%`}} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="pt-2 border-t border-slate-100 dark:border-slate-700 text-[11px] text-slate-500">
                Supplier allocation based on active gate passes
              </div>
            </div>
          </div>

          {/* ======================================================== */}
          {/* ROW 3: FORMAL VERTICAL STATUS CHART + OVERALL REPAIR COMPLETION */}
          {/* ======================================================== */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
            {/* Formal Vertical Bar Chart (7 cols) */}
            <div className={`lg:col-span-7 p-5 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-4`}>
              <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                <div>
                  <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                    <Icon name="bar-chart" size={17} className="text-sky-500" />
                    Repair & Procurement Status Breakdown
                  </h3>
                  <p className={`text-[10px] ${textSub}`}>
                    Active in-repair items by procurement stage — excludes completed. ({stats.inRepair} active of {stats.total} total)
                  </p>
                </div>
                {selectedStageStatus && (
                  <button
                    onClick={() => setSelectedStageStatus(null)}
                    className="px-2.5 py-1 text-[11px] font-bold rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center gap-1 transition-all"
                  >
                    <Icon name="x" size={12} />
                    <span>Clear Selection</span>
                  </button>
                )}
              </div>

              {/* Formal Executive Vertical Bar Columns with Gridlines */}
              <div className="relative pt-6 pb-2 px-4">
                {/* Horizontal Baseline Guides */}
                <div className="absolute inset-x-4 top-6 bottom-14 flex flex-col justify-between pointer-events-none opacity-20">
                  <div className="border-b border-dashed border-slate-400"></div>
                  <div className="border-b border-dashed border-slate-400"></div>
                  <div className="border-b border-dashed border-slate-400"></div>
                  <div className="border-b border-slate-400"></div>
                </div>

                <div className="h-56 flex items-end justify-around gap-4 relative z-10">
                  {formalBarItems.map(item => {
                    const isSelected = selectedStageStatus === item.stage;
                    return (
                      <div
                        key={item.stage}
                        onClick={() => setSelectedStageStatus(isSelected ? null : item.stage)}
                        className={`group flex-1 flex flex-col items-center justify-end h-full cursor-pointer transition-all duration-200 ${
                          isSelected ? 'scale-105' : 'hover:scale-102'
                        }`}
                        title={`Click to view ${item.count} items in ${item.label}`}
                      >
                        {/* Executive Pill on Top */}
                        <div className="mb-2 text-center transition-transform group-hover:-translate-y-1">
                          <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-mono font-black border shadow-sm ${item.badgeStyle}`}>
                            {item.count}
                          </span>
                        </div>

                        {/* Formal Solid Column Pillar with Crisp Border */}
                        <div className={`w-full max-w-[56px] flex-1 flex items-end rounded-t-md border overflow-hidden shadow-sm ${dm ? 'bg-slate-700 border-slate-600' : 'bg-slate-200 border-slate-300'}`}>
                          <div
                            className={`w-full ${item.bgFill} transition-all duration-700 rounded-t-sm ${
                              isSelected ? 'ring-2 ring-sky-500 ring-offset-2' : ''
                            }`}
                            style={{ height: `${item.heightPct}%` }}
                          />
                        </div>

                        {/* Stage Labels Below */}
                        <div className="mt-3 text-center px-1">
                          <span className="block text-[9px] font-mono font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">
                            {item.code}
                          </span>
                          <span className={`block text-xs font-bold ${isSelected ? 'text-sky-600 dark:text-sky-400 font-black' : textMain} leading-tight mt-0.5 max-w-[150px] mx-auto`}>
                            {item.label}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* High-Contrast Interactive Item List when a bar is clicked */}
              {selectedStageStatus && (
                <div className="pt-3 border-t border-slate-200 dark:border-slate-700 animate-fadeIn space-y-2.5">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse"></span>
                      <h4 className="text-xs font-black text-slate-900 dark:text-slate-100">
                        Items in stage: <span className="text-sky-600 dark:text-sky-400 underline underline-offset-2">{selectedStageStatus}</span> ({filteredStageItems.length})
                      </h4>
                    </div>
                    <span className="text-[10px] text-slate-500 font-medium">Click row or Open to view record</span>
                  </div>

                  {filteredStageItems.length === 0 ? (
                    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-center text-xs text-slate-600 dark:text-slate-400 font-medium">
                      No items currently in {selectedStageStatus}.
                    </div>
                  ) : (
                    <div className="max-h-60 overflow-y-auto custom-scrollbar border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 overflow-hidden shadow-sm">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-black uppercase text-[10px] border-b border-slate-200 dark:border-slate-700">
                            <th className="py-2.5 px-3">Work Order #</th>
                            <th className="py-2.5 px-3">POR #</th>
                            <th className="py-2.5 px-3">Gate Pass #</th>
                            <th className="py-2.5 px-3">Item Description</th>
                            <th className="py-2.5 px-3">Supplier</th>
                            <th className="py-2.5 px-3 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {filteredStageItems.map(item => (
                            <tr
                              key={item.id}
                              onClick={() => onSelect(item)}
                              className="hover:bg-sky-50/80 dark:hover:bg-slate-800/80 cursor-pointer transition-colors bg-white dark:bg-slate-900"
                            >
                              <td className="py-2.5 px-3 font-mono font-bold text-sky-700 dark:text-sky-400">
                                <div className="flex items-center gap-1.5">
                                  {item.isUrgent && <span className="px-1.5 py-0.2 rounded bg-rose-600 text-white font-black text-[9px]">URGENT</span>}
                                  <span>{item.woNumber}</span>
                                </div>
                              </td>
                              <td className="py-2.5 px-3 font-mono font-bold text-purple-700 dark:text-purple-300">
                                {item.porNumber || '-'}
                              </td>
                              <td className="py-2.5 px-3 font-mono text-slate-700 dark:text-slate-300">
                                #{item.gatePassNo}
                              </td>
                              <td className="py-2.5 px-3 font-semibold text-slate-900 dark:text-slate-100 max-w-[180px] truncate">
                                {item.itemDescription}
                              </td>
                              <td className="py-2.5 px-3 text-slate-600 dark:text-slate-300">
                                {item.serviceProvider}
                              </td>
                              <td className="py-2.5 px-3 text-right">
                                <button
                                  type="button"
                                  onClick={(e) => { e.stopPropagation(); onSelect(item); }}
                                  className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-700 hover:bg-sky-800 text-white shadow-sm transition-all"
                                >
                                  Open
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Overall Repair Completion Visualization (Streamlined, Year Cards Removed) */}
            <div className={`lg:col-span-5 p-5 rounded-2xl ${bgCard} border ${borderC} shadow-sm flex flex-col justify-between space-y-4`}>
              <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                <div>
                  <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                    <Icon name="trending-up" size={17} className="text-emerald-500" />
                    Overall Repair Completion
                  </h3>
                  <p className={`text-[10px] ${textSub}`}>Return-to-service progress rate across all items</p>
                </div>
                <span className="text-3xl font-black text-emerald-500 font-mono">{completionPct}%</span>
              </div>

              {/* High-Impact Visual Progress Meter */}
              <div className="py-4 space-y-3">
                <div className="flex justify-between items-baseline text-xs">
                  <span className={`font-bold ${textMain}`}>Progress Toward 100% Readiness</span>
                  <span className="font-mono font-bold text-emerald-600 dark:text-emerald-400">
                    {stats.completed} of {stats.total} items received
                  </span>
                </div>

                <div className={`w-full h-5 rounded-full ${dm?'bg-slate-700':'bg-slate-100'} p-0.5 border border-slate-200 dark:border-slate-600 shadow-inner`}>
                  <div
                    className="h-full rounded-full bg-gradient-to-r from-emerald-500 via-teal-500 to-green-500 transition-all duration-1000 shadow-sm"
                    style={{width: `${completionPct}%`}}
                  />
                </div>

                <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                  <span>0% (Dispatched)</span>
                  <span>50%</span>
                  <span>100% (Fully In Stock)</span>
                </div>
              </div>

              {/* Operational Breakdown Cards */}
              <div className="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100 dark:border-slate-700">
                <div className={`p-3.5 rounded-xl border border-emerald-200 dark:border-emerald-800/80 bg-emerald-50/70 dark:bg-emerald-950/40 space-y-1`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-black uppercase text-emerald-800 dark:text-emerald-300">Ready in Stores</span>
                    <Icon name="check-circle" size={14} className="text-emerald-600" />
                  </div>
                  <div className="text-2xl font-black text-emerald-700 dark:text-emerald-400 font-mono">
                    {stats.completed}
                  </div>
                  <p className="text-[10px] text-emerald-800/80 dark:text-emerald-300/80 font-medium">
                    Verified & ready for service
                  </p>
                </div>

                <div className={`p-3.5 rounded-xl border border-amber-200 dark:border-amber-800/80 bg-amber-50/70 dark:bg-amber-950/40 space-y-1`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-black uppercase text-amber-800 dark:text-amber-300">Out at Supplier</span>
                    <Icon name="clock" size={14} className="text-amber-600" />
                  </div>
                  <div className="text-2xl font-black text-amber-700 dark:text-amber-400 font-mono">
                    {stats.inRepair}
                  </div>
                  <p className="text-[10px] text-amber-800/80 dark:text-amber-300/80 font-medium">
                    In repair or procurement
                  </p>
                </div>
              </div>
            </div>
          </div>

          {/* ======================================================== */}
          {/* ROW 4: DELAYED ITEMS DETECTION LIST TABLE */}
          {/* ======================================================== */}
          <div id="delayed-panel" className={`p-5 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-3`}>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-100 dark:border-slate-700/60">
              <div className="flex items-center gap-2">
                <div className={`p-2 rounded-xl ${delayedItems.length > 0 ? 'bg-rose-100 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400' : 'bg-emerald-100 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400'}`}>
                  <Icon name={delayedItems.length > 0 ? "alert-circle" : "check-circle-2"} size={18} />
                </div>
                <div>
                  <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                    Delayed Items Detection List
                    {delayedItems.length > 0 && (
                      <span className="px-2 py-0.5 rounded-full text-xs font-black bg-rose-600 text-white animate-pulse">
                        {delayedItems.length} OVERDUE
                      </span>
                    )}
                  </h3>
                  <p className={`text-[11px] ${textSub}`}>
                    Items with estimated delivery dates passed without stores receipt
                  </p>
                </div>
              </div>
              <span className={`text-xs ${textSub} font-mono`}>Date check: {todayStr}</span>
            </div>

            {delayedItems.length === 0 ? (
              <div className={`p-6 rounded-xl border ${borderC} ${dm?'bg-slate-700/20':'bg-emerald-50/50'} text-center space-y-1`}>
                <p className="text-xs font-bold text-emerald-600 dark:text-emerald-400 flex items-center justify-center gap-1.5"><Icon name="check-circle" size={14} /> No Delayed Items</p>
                <p className={`text-[11px] ${textSub}`}>All scheduled repairs are within their estimated delivery windows or completed.</p>
              </div>
            ) : (
              <div className="overflow-x-auto custom-scrollbar border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 shadow-sm">
                <table className="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-black uppercase text-[10px] border-b border-slate-200 dark:border-slate-700">
                      <th className="py-2.5 px-3">Work Order #</th>
                      <th className="py-2.5 px-3">POR #</th>
                      <th className="py-2.5 px-3">Gate Pass #</th>
                      <th className="py-2.5 px-3">Supplier</th>
                      <th className="py-2.5 px-3">Est. Delivery Date</th>
                      <th className="py-2.5 px-3">Overdue</th>
                      <th className="py-2.5 px-3">Item Description</th>
                      <th className="py-2.5 px-3 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {delayedItems.map(item => (
                      <tr key={item.id} onClick={()=>onSelect(item)}
                        className={`cursor-pointer transition-colors border-l-4 border-l-rose-500 ${
                          item.isUrgent
                            ? (dm ? 'bg-rose-950/20 hover:bg-rose-950/40 text-slate-100' : 'bg-rose-50/70 hover:bg-rose-100/70 text-slate-900')
                            : (dm ? 'bg-slate-800/80 hover:bg-slate-700/80 text-slate-100' : 'bg-white hover:bg-sky-50 text-slate-900')
                        }`}>
                        <td className="py-2.5 px-3 font-mono font-bold text-sky-700 dark:text-sky-400">
                          <div className="flex items-center gap-1.5">
                            {item.isUrgent && (
                              <span className="px-1.5 py-0.2 rounded bg-rose-600 text-white text-[9px] font-black uppercase">
                                URGENT
                              </span>
                            )}
                            <span>{item.woNumber}</span>
                          </div>
                        </td>
                        <td className={`py-2.5 px-3 font-mono font-semibold ${textMain}`}>{item.porNumber || '-'}</td>
                        <td className={`py-2.5 px-3 font-mono ${textSub}`}>#{item.gatePassNo}</td>
                        <td className={`py-2.5 px-3 font-semibold ${textMain}`}>{item.serviceProvider}</td>
                        <td className="py-2.5 px-3 font-mono font-bold text-rose-600 dark:text-rose-400">{item.estReceiveDate}</td>
                        <td className="py-2.5 px-3">
                          <span className="px-2 py-0.5 rounded-full text-xs font-black bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300 border border-rose-300 dark:border-rose-800 font-mono">
                            +{item.daysOverdue} days
                          </span>
                        </td>
                        <td className={`py-2.5 px-3 ${textMain} max-w-[200px] truncate`}>{item.itemDescription}</td>
                        <td className="py-2.5 px-3 text-right">
                          <button
                            type="button"
                            onClick={(e)=>{ e.stopPropagation(); onSelect(item); }}
                            className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-700 hover:bg-sky-800 text-white shadow-sm"
                          >
                            Open Item
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

        </div>
      );
    }

    // ==========================================
    // STAGE 1: REPAIR DISPATCH VIEW (MANDATORY POR NUMBER, BOTTOM TABLE REMOVED)
    // ==========================================
    function Stage1DispatchView({ onSubmit, existingItems = [], suppliers, onAddSupplier, uoms, onAddUom, darkMode:dm }) {
      const bgCard=dm?'bg-slate-800':'bg-white'; const borderC=dm?'border-slate-700':'border-slate-200';
      const textMain=dm?'text-slate-100':'text-slate-900'; const textSub=dm?'text-slate-400':'text-slate-600';
      const bgInput=dm?'bg-slate-700 border-slate-600 text-slate-100 placeholder-slate-400':'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-500';

      const [form, setForm] = useState({
        woNumber: "WO", porNumber: "", gatePassNo: "", dispatchDate: new Date().toISOString().slice(0,10),
        itemDescription: "", isFoc: false, focMasterWo: "", focDescription: "", serialModelNo: "",
        serviceProvider: "", dispatchQty: 1, dispatchUom: "Each", takenBy: "", isUrgent: false
      });

      const [supplierInput, setSupplierInput] = useState("");
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);
      const supplierRef = useRef(null);

      const [uomInput, setUomInput] = useState("Each");
      const [isUomDropdownOpen, setIsUomDropdownOpen] = useState(false);
      const uomRef = useRef(null);

      const duplicateCount = useMemo(() => {
        if (!form.woNumber.trim() || form.woNumber.trim().toUpperCase() === "WO") return 0;
        const norm = form.woNumber.trim().toLowerCase();
        return (existingItems || []).filter(i => (i.woNumber || '').trim().toLowerCase() === norm).length;
      }, [form.woNumber, existingItems]);

      const filteredSuppliers = useMemo(() => {
        return supplierInput
          ? suppliers.filter(s => s.toLowerCase().includes(supplierInput.toLowerCase()))
          : suppliers;
      }, [suppliers, supplierInput]);

      const filteredUoms = useMemo(() => {
        return uomInput
          ? uoms.filter(u => u.toLowerCase().includes(uomInput.toLowerCase()))
          : uoms;
      }, [uoms, uomInput]);

      useEffect(() => {
        const handler = e => { 
          if(supplierRef.current && !supplierRef.current.contains(e.target)) setIsDropdownOpen(false); 
          if(uomRef.current && !uomRef.current.contains(e.target)) setIsUomDropdownOpen(false); 
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const handleSubmit = e => {
        e.preventDefault();
        // Mandatory fields validation: Work Order Number, POR Number, Gate Pass Number, Item Description
        if(!form.woNumber.trim() || form.woNumber.trim().toUpperCase() === "WO"){
          alert("Please fill in the complete Work Order Number.");
          return;
        }
        if(!form.porNumber.trim()){
          alert("POR Number is required and cannot be empty!");
          return;
        }
        if(!form.gatePassNo.trim()){
          alert("Please fill in Gate Pass Number.");
          return;
        }
        if(!form.itemDescription.trim()){
          alert("Please fill in Item Description.");
          return;
        }

        const finalSupplier = supplierInput.trim();
        if(!finalSupplier){
          alert("Please select or enter a Service Provider / Supplier.");
          return;
        }
        if(!suppliers.includes(finalSupplier)) onAddSupplier(finalSupplier);

        const finalUom = uomInput.trim() || form.dispatchUom || "Each";
        if(!uoms.includes(finalUom)) onAddUom(finalUom);

        onSubmit({
          ...form,
          woNumber: form.woNumber.trim(),
          porNumber: form.porNumber.trim(),
          serviceProvider: finalSupplier,
          dispatchUom: finalUom,
          isFoc: Boolean(form.isFoc),
          focMasterWo: form.isFoc ? form.focMasterWo.trim() : "",
          focDescription: form.isFoc ? form.focDescription.trim() : "",
          isUrgent: Boolean(form.isUrgent)
        });

        setForm({
          woNumber: "WO", porNumber: "", gatePassNo: "", dispatchDate: new Date().toISOString().slice(0,10),
          itemDescription: "", isFoc: false, focMasterWo: "", focDescription: "", serialModelNo: "",
          serviceProvider: "", dispatchQty: 1, dispatchUom: "Each", takenBy: "", isUrgent: false
        });
        setSupplierInput("");
        setUomInput("Each");
      };

      const ic = `w-full px-3 py-2 rounded-lg border text-xs focus:outline-none focus:border-sky-500 transition-all ${bgInput}`;
      const lc = `block font-bold mb-1 ${textMain}`;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className={`border-b ${borderC} pb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2`}>
            <div>
              <h2 className={`text-lg font-extrabold ${textMain}`}>Repair Dispatch item</h2>
              <p className={`text-xs ${textSub} mt-0.5`}>Register repair dispatches. POR Number is mandatory for all items.</p>
            </div>
          </div>

          <form onSubmit={handleSubmit} className={`p-5 md:p-6 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-5 text-xs`}>
            
            {/* Urgent toggle row */}
            <div className="flex items-center justify-between border-b pb-3 border-slate-200 dark:border-slate-700">
              <div>
                <span className={`text-xs font-bold ${textMain}`}>Priority Dispatch Classification</span>
                <p className={`text-[11px] ${textSub}`}>Flag time-critical repairs to accelerate procurement and store receiving</p>
              </div>
              <button
                type="button"
                onClick={()=>setForm(prev=>({ ...prev, isUrgent: !prev.isUrgent }))}
                className={`px-4 py-2 rounded-xl text-xs font-black border transition-all flex items-center gap-2 ${
                  form.isUrgent
                    ? 'bg-rose-600 text-white border-rose-600 shadow-md ring-2 ring-rose-400/50'
                    : (dm ? 'bg-slate-700/60 border-slate-600 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 border-slate-300 text-slate-700 hover:bg-slate-200')
                }`}
              >
                <Icon name="alert-triangle" size={16} className={form.isUrgent ? 'text-white' : 'text-slate-400'} />
                <span>{form.isUrgent ? 'MARKED AS URGENT' : 'Mark as Urgent'}</span>
              </button>
            </div>

            {/* Mandatory Fields */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
              <div>
                <label className={lc}>
                  1. Work Order Number <span className="text-rose-500">*</span>
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. WO2854405"
                  value={form.woNumber}
                  onChange={e=>setForm({...form, woNumber:e.target.value})}
                  className={`${ic} font-mono`}
                />
                {duplicateCount > 0 && (
                  <p className="text-amber-600 dark:text-amber-400 text-[10px] font-semibold mt-1 flex items-center gap-1 animate-fadeIn">
                    <Icon name="info" size={12} /> Note: Work Order has {duplicateCount} prior row(s).
                  </p>
                )}
              </div>

              {/* POR NUMBER IS MANDATORY */}
              <div>
                <label className={lc}>
                  2. POR Number <span className="text-rose-500 font-extrabold">*</span>
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. POR-48192 (Required)"
                  value={form.porNumber}
                  onChange={e=>setForm({...form, porNumber:e.target.value})}
                  className={`${ic} font-mono border-rose-300 dark:border-rose-800/60 focus:border-rose-500`}
                />
              </div>

              <div>
                <label className={lc}>3. Gate Pass Number <span className="text-rose-500">*</span></label>
                <input type="text" required placeholder="e.g. 5462" value={form.gatePassNo}
                  onChange={e=>setForm({...form, gatePassNo:e.target.value})} className={`${ic} font-mono`} />
              </div>

              <div>
                <label className={lc}>4. Dispatch Date <span className="text-rose-500">*</span></label>
                <input type="date" required value={form.dispatchDate}
                  onChange={e=>setForm({...form, dispatchDate:e.target.value})} className={ic} />
              </div>
            </div>

            <div>
              <label className={lc}>5. Item Description <span className="text-rose-500">*</span></label>
              <textarea rows={2} required placeholder="Full description (e.g. RTG Wheel Hub + Ring / Gantry Motor)"
                value={form.itemDescription} onChange={e=>setForm({...form, itemDescription:e.target.value})} className={ic} />
            </div>

            {/* Warranty / FOC */}
            <div className={`p-3.5 rounded-xl ${dm?'bg-purple-950/40 border-purple-800':'bg-purple-100/80 border-purple-300'} border space-y-2`}>
              <label className={`flex items-center gap-2.5 cursor-pointer font-extrabold ${dm?'text-purple-200':'text-purple-950'}`}>
                <input
                  type="checkbox"
                  checked={Boolean(form.isFoc)}
                  onChange={e => setForm(prev => ({
                    ...prev,
                    isFoc: e.target.checked,
                    focMasterWo: e.target.checked ? prev.focMasterWo : "",
                    focDescription: e.target.checked ? prev.focDescription : ""
                  }))}
                  className="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 cursor-pointer"
                />
                <span>Warranty / FOC Item (Free Of Charge - Warranty Repair)</span>
              </label>
              {form.isFoc && (
                <div className="pt-2 pl-6 space-y-2.5 animate-fadeIn">
                  <div>
                    <label className={`block font-bold mb-1 ${dm?'text-purple-300':'text-purple-900'}`}>
                      Master / Related Work Order # (FOC Warranty Reference)
                    </label>
                    <input
                      type="text"
                      placeholder="Enter Master WO # or Previous GP #"
                      value={form.focMasterWo}
                      onChange={e=>setForm({...form, focMasterWo:e.target.value})}
                      className={`w-full px-3 py-2 rounded-lg border font-mono text-xs focus:outline-none ${dm?'bg-slate-800 border-purple-600 text-purple-100':'bg-white border-purple-400 text-slate-900'}`}
                    />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${dm?'text-purple-300':'text-purple-900'}`}>
                      FOC Description (Optional)
                    </label>
                    <input
                      type="text"
                      placeholder="Optional notes regarding warranty coverage, defect cause, or claims..."
                      value={form.focDescription}
                      onChange={e=>setForm({...form, focDescription:e.target.value})}
                      className={`w-full px-3 py-2 rounded-lg border text-xs focus:outline-none ${dm?'bg-slate-800 border-purple-600 text-purple-100':'bg-white border-purple-400 text-slate-900'}`}
                    />
                  </div>
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className={lc}>Serial / Model Number</label>
                <input type="text" placeholder="e.g. ESN923216885" value={form.serialModelNo}
                  onChange={e=>setForm({...form, serialModelNo:e.target.value})} className={`${ic} font-mono`} />
              </div>

              <div className="relative" ref={supplierRef}>
                <label className={lc}>Service Provider / Supplier <span className="text-rose-500">*</span></label>
                <input type="text" placeholder="Type to search or add supplier..." value={supplierInput}
                  onChange={e=>{setSupplierInput(e.target.value); setIsDropdownOpen(true);}}
                  onFocus={()=>setIsDropdownOpen(true)} className={ic} />
                {isDropdownOpen && (
                  <div className={`absolute left-0 right-0 mt-1 ${dm?'bg-slate-800 border-slate-600':'bg-white border-slate-200'} border rounded-xl shadow-2xl z-50 max-h-48 overflow-y-auto custom-scrollbar animate-fadeIn`}>
                    {filteredSuppliers.map(s => (
                      <div key={s} onClick={()=>{ setSupplierInput(s); setIsDropdownOpen(false); }}
                        className={`px-3 py-2 cursor-pointer font-medium text-xs border-b last:border-none ${dm?'text-slate-200 border-slate-700 hover:bg-slate-700':'text-slate-800 border-slate-100 hover:bg-sky-50'}`}>
                        {s}
                      </div>
                    ))}
                    {supplierInput.trim() && !suppliers.includes(supplierInput.trim()) && (
                      <div onClick={()=>{ onAddSupplier(supplierInput.trim()); setIsDropdownOpen(false); }}
                        className={`px-3 py-2.5 font-bold cursor-pointer text-xs flex items-center gap-2 ${dm?'bg-purple-900/40 text-purple-300 hover:bg-purple-900/60':'bg-purple-50 text-purple-900 hover:bg-purple-100'}`}>
                        <Icon name="plus-circle" size={15} />
                        <span>+ Add "{supplierInput.trim()}" as New Supplier</span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label className={lc}>Dispatched Quantity</label>
                <input type="number" min="1" value={form.dispatchQty}
                  onChange={e=>setForm({...form, dispatchQty: Math.max(1, parseInt(e.target.value)||1)})} className={`${ic} font-bold`} />
              </div>

              <div className="relative" ref={uomRef}>
                <label className={lc}>UOM (Unit of Measure)</label>
                <input
                  type="text"
                  placeholder="Search or add UOM..."
                  value={uomInput}
                  onChange={e=>{ setUomInput(e.target.value); setIsUomDropdownOpen(true); }}
                  onFocus={()=>setIsUomDropdownOpen(true)}
                  className={ic}
                />
                {isUomDropdownOpen && (
                  <div className={`absolute left-0 right-0 mt-1 ${dm?'bg-slate-800 border-slate-600':'bg-white border-slate-200'} border rounded-xl shadow-2xl z-50 max-h-40 overflow-y-auto custom-scrollbar animate-fadeIn`}>
                    {filteredUoms.map(u => (
                      <div key={u} onClick={()=>{ setUomInput(u); setForm(prev=>({ ...prev, dispatchUom: u })); setIsUomDropdownOpen(false); }}
                        className={`px-3 py-2 cursor-pointer font-medium text-xs border-b last:border-none ${dm?'text-slate-200 border-slate-700 hover:bg-slate-700':'text-slate-800 border-slate-100 hover:bg-sky-50'}`}>
                        {u}
                      </div>
                    ))}
                    {uomInput.trim() && !uoms.includes(uomInput.trim()) && (
                      <div onClick={()=>{ onAddUom(uomInput.trim()); setForm(prev=>({ ...prev, dispatchUom: uomInput.trim() })); setIsUomDropdownOpen(false); }}
                        className={`px-3 py-2 font-bold cursor-pointer text-xs flex items-center gap-1.5 ${dm?'bg-sky-900/40 text-sky-300':'bg-sky-50 text-sky-900'}`}>
                        <Icon name="plus-circle" size={14} />
                        <span>+ Add "{uomInput.trim()}"</span>
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div>
                <label className={lc}>Taken By</label>
                <input type="text" placeholder="Name of officer" value={form.takenBy}
                  onChange={e=>setForm({...form, takenBy:e.target.value})} className={ic} />
              </div>
            </div>

            <div className={`pt-3 border-t ${borderC} flex justify-end`}>
              <button
                type="submit"
                className="px-6 py-2.5 bg-sky-700 hover:bg-sky-800 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center gap-2"
              >
                <Icon name="send" size={16} /><span>Dispatch Item (Move to Procurement Process)</span>
              </button>
            </div>
          </form>
          {/* Below table (Active Items in Repair Dispatch Queue) removed as requested */}
        </div>
      );
    }

    // ==========================================
    // STAGE 2: PROCUREMENT PROCESS (RENAMED SUB-STAGES & EYE-CATCHING VIBRANT COLORS)
    // ==========================================
    function Stage2ProcurementView({ items, onSubmit, user, darkMode:dm }) {
      const bgCard=dm?'bg-slate-800':'bg-white'; const borderC=dm?'border-slate-700':'border-slate-200';
      const textMain=dm?'text-slate-100':'text-slate-900'; const textSub=dm?'text-slate-400':'text-slate-500';
      const bgInput=dm?'bg-slate-700 border-slate-600 text-slate-100':'bg-slate-50 border-slate-200 text-slate-900';

      const [selectedId, setSelectedId] = useState("");
      const [data, setData] = useState({ 
        quotationRecDate: "", 
        quotationAppDate: "", 
        estReceiveDate: "", 
        poNumber: "", 
        procurementRemarks: "" 
      });
      const [dateError, setDateError] = useState("");
      const [subStageFilter, setSubStageFilter] = useState("ALL");

      const sortedItems = useMemo(() => {
        return [...items].sort((a,b) => {
          if (Boolean(a.isUrgent) !== Boolean(b.isUrgent)) return a.isUrgent ? -1 : 1;
          return (b.id || '').localeCompare(a.id || '');
        });
      }, [items]);

      const selectedItem = sortedItems.find(i=>i.id===selectedId);
      const currentStage = selectedItem?.procurementStage || "Pending Quotation";

      useEffect(() => {
        if (selectedItem) {
          setData({
            quotationRecDate: selectedItem.quotationRecDate || "",
            quotationAppDate: selectedItem.quotationAppDate || "",
            estReceiveDate: selectedItem.estReceiveDate || "",
            poNumber: selectedItem.poNumber || "",
            procurementRemarks: selectedItem.procurementRemarks || ""
          });
          setDateError("");
        } else {
          setSelectedId("");
        }
      }, [selectedId, selectedItem]);

      const kpis = useMemo(() => ({
        pendingQuote: sortedItems.filter(i => (i.procurementStage || 'Pending Quotation') === 'Pending Quotation').length,
        pendingApp:   sortedItems.filter(i => i.procurementStage === 'Pending Quotation Approval').length,
        pendingPo:    sortedItems.filter(i => i.procurementStage === 'Pending Purchase Order').length,
      }), [sortedItems]);

      const displayedQueue = useMemo(() => {
        if (subStageFilter === "ALL") return sortedItems;
        return sortedItems.filter(i => (i.procurementStage || 'Pending Quotation') === subStageFilter);
      }, [sortedItems, subStageFilter]);

      const ic = `w-full px-3 py-2 rounded-lg border text-xs focus:outline-none focus:border-purple-500 ${bgInput}`;

      const handleAppDateChange = (val) => {
        if (data.quotationRecDate && val && val < data.quotationRecDate) {
          setDateError("Quotation Approved Date cannot be before Quotation Received Date.");
        } else {
          setDateError("");
        }
        setData(prev=>({ ...prev, quotationAppDate: val }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        if (!selectedId || !selectedItem) return;

        if (currentStage === "Pending Quotation") {
          if (!data.quotationRecDate) {
            alert("Please specify the Quotation Received Date.");
            return;
          }
          onSubmit(selectedId, {
            quotationRecDate: data.quotationRecDate,
            procurementRemarks: data.procurementRemarks,
            procurementStage: "Pending Quotation Approval"
          });
        } else if (currentStage === "Pending Quotation Approval") {
          if (!data.quotationAppDate) {
            alert("Please specify the Quotation Approved Date.");
            return;
          }
          if (data.quotationRecDate && data.quotationAppDate < data.quotationRecDate) {
            alert("Validation Error: Quotation Approved Date cannot be earlier than Quotation Received Date.");
            return;
          }
          onSubmit(selectedId, {
            quotationAppDate: data.quotationAppDate,
            procurementRemarks: data.procurementRemarks,
            procurementStage: "Pending Purchase Order"
          });
        } else if (currentStage === "Pending Purchase Order") {
          if (!data.estReceiveDate) {
            alert("Please enter the Estimated Receive Date.");
            return;
          }
          onSubmit(selectedId, {
            estReceiveDate: data.estReceiveDate,
            poNumber: (data.poNumber || '').trim(),
            procurementRemarks: data.procurementRemarks,
            procurementStage: "Completed",
            procurementCompleted: true
          });
        }

        setSelectedId("");
      };

      return (
        <div className="max-w-4xl mx-auto space-y-4">
          <div className={`border-b ${borderC} pb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2`}>
            <div>
              <h2 className={`text-lg font-extrabold ${textMain}`}>Procurement Process</h2>
              <p className={`text-xs ${textSub} mt-0.5`}>
                Sequential stages: Pending Quotation &rarr; Pending Quotation Approval &rarr; Pending Purchase Order.
              </p>
            </div>
            <span className={`text-xs font-mono font-bold px-3 py-1 rounded-full ${dm?'bg-purple-950/60 text-purple-300 border border-purple-800':'bg-purple-100 text-purple-900 border border-purple-200'}`}>
              {sortedItems.length} Total In Queue

          </div>

          {/* VIBRANT EYE-CATCHING STAGE KPI COUNTERS */}
          <div className="grid grid-cols-3 gap-3.5">
            {/* 1. Pending Quotation (Vibrant Amber / Gold) */}

            {/* 3. Pending Purchase Order (Vibrant Sky Blue / Cyan) */}

          <div className={`p-4 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-2`}>

            <select

              onChange={e => setSelectedId(e.target.value)}

                </option>

          </div>

          {!selectedItem ? (
            <div className={`p-6 rounded-2xl ${bgCard} border ${borderC} shadow-sm space-y-3`}>
              <div className="flex items-center justify-between">
                <h3 className={`font-bold text-sm ${textMain} flex items-center gap-2`}>
                  <Icon name="file-text" size={16} className="text-purple-600" />
                  Procurement Queue ({displayedQueue.length}{subStageFilter !== 'ALL' ? ` · ${subStageFilter}` : ''})
                </h3>
                {subStageFilter !== "ALL" && (
                  <button onClick={()=>setSubStageFilter("ALL")} className="text-[11px] text-purple-600 hover:underline font-bold">
                    Clear filter

              </div>
              {displayedQueue.length === 0 ? (
                <div className="text-center py-10 space-y-2">
                  <Icon name="check-circle-2" size={32} className="text-emerald-500 mx-auto" />
                  <p className={`text-xs font-semibold ${textMain}`}>No items in this procurement sub-stage!</p>
                </div>
              ) : (
                <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className={`border-b ${borderC} ${textSub} text-[10px] font-bold uppercase`}>
                        <th className="py-2.5 px-3">WO & Gate Pass</th>
                        <th className="py-2.5 px-3">POR #</th>
                        <th className="py-2.5 px-3">Current Stage</th>
                        <th className="py-2.5 px-3">Item Description</th>
                        <th className="py-2.5 px-3">Supplier</th>
                        <th className="py-2.5 px-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className={`divide-y ${borderC}`}>
                      {displayedQueue.map(item => {
                        const stName = item.procurementStage || 'Pending Quotation';

                              isUrg
                                ? (dm ? 'bg-rose-950/20 hover:bg-rose-950/40' : 'bg-rose-50/70 hover:bg-rose-100/70')

                            <td className="py-2.5 px-3 font-mono">
                              <div className="flex items-center gap-1.5">
                                {isUrg && <span className="px-1.5 py-0.2 rounded bg-rose-600 text-white text-[9px] font-black">URGENT</span>}
                                <span className="font-bold text-sky-600">{item.woNumber}</span>
                              </div>
                              <div className={`text-[10px] ${textSub}`}>GP #{item.gatePassNo}</div>
                            </td>
                            <td className="py-2.5 px-3 font-mono font-bold text-slate-800 dark:text-slate-200">
                              {item.porNumber || '-'}
                            </td>
                            <td className="py-2.5 px-3 font-medium">
                              <span className={`px-2.5 py-1 rounded-full text-[11px] font-extrabold border ${theme.badge} inline-flex items-center gap-1.5 shadow-sm`}>
                                <span className={`w-2 h-2 rounded-full ${theme.dot}`}></span>
                                {stName}
                              </span>
                            </td>
                            <td className={`py-2.5 px-3 ${textMain} font-medium max-w-[200px] truncate`}>{item.itemDescription}</td>
                            <td className={`py-2.5 px-3 ${textSub}`}>{item.serviceProvider}</td>
                            <td className="py-2.5 px-3 text-right">
                              <button

          ) : (

              <div className={`p-3.5 rounded-xl ${dm?'bg-slate-700/40 border-slate-600':'bg-purple-50/70 border-purple-200'} border flex flex-col sm:flex-row sm:items-center justify-between gap-2`}>
                <div className="space-y-0.5">
                  <div className="flex items-center gap-2 flex-wrap">

                      <span className="px-2 py-0.5 rounded bg-rose-600 text-white font-black text-[10px] uppercase">

                      </span>
                    )}
                    <span className="font-bold text-sky-600 font-mono">WO: {selectedItem.woNumber}</span>
                    <span className={`font-bold ${textMain}`}>GP #{selectedItem.gatePassNo}</span>
                    <span className="font-mono text-purple-700 dark:text-purple-300 font-bold">POR: {selectedItem.porNumber || '-'}</span>
                  </div>
                  <p className={`${textMain} font-medium`}>{selectedItem.itemDescription}</p>
                  <p className={`${textSub}`}>
                    Supplier: <strong className={textMain}>{selectedItem.serviceProvider}</strong> | Qty: {selectedItem.dispatchQty} {selectedItem.dispatchUom}
                  </p>
                </div>
                <button type="button" onClick={()=>setSelectedId("")}
                  className={`px-3 py-1 rounded-lg border ${borderC} ${textSub} hover:${textMain} text-[11px] font-semibold`}>
                  Change Selection
                </button>
              </div>

              {/* Current Sub-stage visual workflow tracker */}
              <div className="flex items-center justify-between border-b pb-3 border-slate-200 dark:border-slate-700">
                <span className="font-bold text-xs uppercase tracking-wider flex items-center gap-1.5">
                  <Icon name="git-commit" size={14} className="text-purple-600" />
                  Active Sub-Stage: <strong className={STAGE_THEMES[currentStage]?.text || 'text-purple-600'}>{currentStage}</strong>
                </span>
                <span className="text-[11px] text-slate-500 font-mono">
                  {currentStage === 'Pending Quotation' ? 'Stage 1 of 3' : currentStage === 'Pending Quotation Approval' ? 'Stage 2 of 3' : 'Stage 3 of 3'}

                  <Icon name="alert-circle" size={16} />

              {currentStage === "Pending Quotation" && (

                      Quotation Received Date <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="date"
                      required
                      value={data.quotationRecDate}
                      onChange={e=>setData({...data, quotationRecDate:e.target.value})}
                      className={ic}
                    />
                    <p className={`text-[10px] ${textSub} mt-1 font-medium`}>
                      Recording quotation date advances this item to <strong>"Pending Quotation Approval"</strong>.
                    </p>
                  </div>
                </div>
              )}

              {/* Sub-Stage 2: Pending Quotation Approval */}
              {currentStage === "Pending Quotation Approval" && (
                <div className="space-y-3 animate-fadeIn">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${textSub}`}>Quotation Received Date (Recorded)</label>
                      <input type="date" disabled value={data.quotationRecDate} className={`${ic} opacity-75 cursor-not-allowed`} />
                    </div>
                    <div className="p-3.5 rounded-xl bg-indigo-50/60 dark:bg-indigo-950/40 border border-indigo-300 dark:border-indigo-800">
                      <label className={`block font-bold mb-1 ${textMain}`}>
                        Quotation Approved Date <span className="text-rose-500">*</span>
                      </label>
                      <input
                        type="date"

                        value={data.quotationAppDate}
                        onChange={e=>handleAppDateChange(e.target.value)}

                        Advances item to <strong>"Pending Purchase Order"</strong>.
                      </p>

              {/* Sub-Stage 3: Pending Purchase Order */}
              {currentStage === "Pending Purchase Order" && (
                <div className="space-y-3 animate-fadeIn">
